name: docker

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: baton:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run -d --name baton -e BATON_TOKEN=ci -p 7317:7317 baton:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7317/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs baton || true
            docker rm -f baton || true
            exit 1
          fi
          docker exec baton id -u
          docker logs baton
          docker rm -f baton

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
